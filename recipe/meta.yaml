{% set name = "eozilla" %}
{% set version = "0.4.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/eozilla-{{ version }}.tar.gz
  sha256: a767c6322625cc89ffb85ed1138472aa6bcede18e4817ed0893f12441ab4d78c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - appligator >=0.3.0
    - cuiman >=0.3.0
    - gavicore >=0.3.0
    - procodile >=0.3.0
    - wraptile >=0.3.0

test:
  imports:
    - eozilla
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eo-tools/eozilla/tree/main/eozilla
  doc_url: https://eo-tools.github.io/eozilla/
  dev_url: https://github.com/eo-tools/eozilla/
  summary: Eozilla 🦖 has been developed to cloudify satellite data processor applications
  description: |
    Eozilla 🦖 is a suite of tools for workflow orchestration systems and a
    [OGC API - Processes](https://github.com/opengeospatial/ogcapi-processes)
    implementation.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - freds-dev
    - AliceBalfanz
    - b-yogesh
    - clarasb
    - forman
    - konstntokas
    - pont-us
    - TejasMorbagal
    - thomasstorm
    - TonioF
